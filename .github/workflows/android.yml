name: Android Native CI

on:
  push:
    branches: ['arena/9acc339c-hesabyar']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build native Android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi
      - name: Verify and build
        run: |
          set +e
          ./gradlew :core:common:test :core:calendar:test :core:currency:test :core:validation:test :domain:test :core:database:assembleDebug :data:assembleDebug :billing:assembleDebug :core:design:assembleDebug :feature:assembleDebug :data:testDebugUnitTest :app:assembleDebug :app:bundleRelease --stacktrace --no-daemon --console=plain > build.log 2>&1
          status=$?
          tail -n 220 build.log
          python3 - <<'PY'
          import pathlib
          lines = pathlib.Path('build.log').read_text(errors='replace').splitlines()
          selected = []
          for i, line in enumerate(lines):
              if line.startswith('e: ') or 'Unresolved reference' in line or 'error:' in line.lower() or 'Could not' in line or 'Exception' in line:
                  selected.append(line)
              if line.startswith('* What went wrong:'):
                  selected.extend(lines[i:i+18])
          if not selected:
              selected = lines[-60:]
          seen = set()
          count = 0
          for line in selected:
              msg = line.strip()[:900]
              if not msg or msg in seen:
                  continue
              seen.add(msg)
              print('::error::' + msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
              count += 1
              if count >= 45:
                  break
          PY
          exit $status
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
