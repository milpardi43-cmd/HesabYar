name: Android Native CI

on:
  push:
    branches: ['arena/9acc339c-hesabyar']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build native Android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          else
            echo "sdkmanager not found; relying on preinstalled SDK"
          fi
      - name: Build debug APK and release AAB
        run: ./gradlew :app:assembleDebug :app:bundleRelease --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
